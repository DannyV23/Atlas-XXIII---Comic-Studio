<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/atlas_app_symbol.ico" />
    <link rel="icon" type="image/png" sizes="512x512" href="/atlas_app_symbol_512.png" />
    <link rel="apple-touch-icon" href="/atlas_app_symbol_512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas XXIII Suite - Comic Studio</title>
    <meta name="description" content="Atlas XXIII Suite - Comic Studio created by Danny Vain. High-fidelity comic authoring, visual panel layouts, and character consistency lab." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --page-height: min(80vh, 1000px);
      }

      body {
        min-height: 100vh;
        background-color: #0E070C;
        color: #FAF5F0;
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        margin: 0;
        overflow: hidden;
      }

      /* Global Comic Font Spacing */
      .font-comic { 
        font-family: 'Bangers', cursive; 
        letter-spacing: 0.08em; 
      }

      /* --- 2D Viewer Mechanics --- */
      .comic-scene {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      /* --- Authentic Gloss Finish --- */
      .gloss {
        position: absolute;
        inset: 0;
        background: 
            linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.08) 45%, rgba(255,255,255,0.22) 50%, rgba(255,255,255,0.08) 55%, transparent 65%),
            linear-gradient(to bottom, rgba(255,255,255,0.04) 0%, transparent 15%);
        pointer-events: none; 
        z-index: 30;
        mix-blend-mode: screen;
        opacity: 0.55;
      }

      /* --- Panel Content --- */
      .panel-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fff; 
        padding: 12px; 
        box-sizing: border-box;
        box-shadow: 0 10px 40px rgba(0,0,0,0.7);
        border-radius: 4px;
        overflow: hidden;
      }

      .panel-image {
        width: 100%;
        height: 100%;
        object-fit: contain; 
        display: block;
        pointer-events: none;
        background-color: #fff; 
      }

      /* Full bleed logic */
      .panel-container.full-bleed {
        padding: 0;
        background-color: #0A0307;
      }
      .panel-container.full-bleed .panel-image {
        object-fit: cover;
      }

      /* Custom Scrollbar for Editor */
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #13070F; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #3B1629; border-radius: 9999px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #C68B59; }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-[#0E070C] text-[#FAF5F0] min-h-screen selection:bg-[#C68B59]/30 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
