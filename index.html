
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas XXIII - Comic Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Bangers&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --page-height: min(80vh, 1000px);
        /* Width is now calculated dynamically in JS/React to support different aspect ratios */
      }

      /* Fixed background layer */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-color: #222;
        background-image: radial-gradient(#333 15%, transparent 16%), radial-gradient(#333 15%, transparent 16%);
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
        z-index: -1;
        pointer-events: none;
      }

      body {
        min-height: 100vh;
        font-family: 'Comic Neue', sans-serif;
        margin: 0;
        overflow: hidden; /* Full screen app feel */
      }
      
      /* Global Comic Font Spacing Fix */
      .font-comic { 
          font-family: 'Bangers', cursive; 
          letter-spacing: 0.08em; 
      }

      /* --- 2D Viewer Mechanics --- */
      .comic-scene {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
        background: transparent;
      }

      /* --- Authentic GLOSS finish --- */
      .gloss {
        position: absolute;
        inset: 0;
        /* Realistic sharp glossy reflection band + top gentle catch-light */
        background: 
            linear-gradient(115deg, transparent 35%, rgba(255,255,255,0.1) 45%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0.1) 55%, transparent 65%),
            linear-gradient(to bottom, rgba(255,255,255,0.05) 0%, transparent 15%);
        pointer-events: none; 
        z-index: 30;
        mix-blend-mode: screen;
        opacity: 0.6;
      }

      /* --- Panel Content --- */
      .panel-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #fff; 
        padding: 12px; 
        box-sizing: border-box;
        box-shadow: 0 0 20px rgba(0,0,0,0.5);
      }

      .panel-image {
        width: 100%;
        height: 100%;
        object-fit: contain; 
        display: block;
        pointer-events: none;
        background-color: #fff; 
      }

      /* Full bleed logic */
      .panel-container.full-bleed {
          padding: 0;
          background-color: #0a0a0a;
      }
      .panel-container.full-bleed .panel-image {
          object-fit: cover;
      }

      .comic-btn {
        font-family: 'Bangers', cursive;
        letter-spacing: 1.5px;
        border: 3px solid black;
        box-shadow: 5px 5px 0px black;
        transition: all 0.1s ease;
        text-transform: uppercase;
        cursor: pointer;
      }
      .comic-btn:hover:not(:disabled) {
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0px black;
      }
      .comic-btn:active:not(:disabled) {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0px black;
      }
      .comic-btn:disabled {
        filter: grayscale(80%); opacity: 0.7; cursor: wait;
      }

      /* Custom Scrollbar for Editor */
      .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
      .custom-scrollbar::-webkit-scrollbar-track { bg: #111; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #777; }
    </style>

{
